apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubesight-default-deny-ingress
  namespace: kubesight
  labels:
    app.kubernetes.io/name: kubesight
    app.kubernetes.io/part-of: kubesight
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubesight-backend-policy
  namespace: kubesight
  labels:
    app.kubernetes.io/name: kubesight
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubesight
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from frontend pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubesight
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 8000
    # Allow traffic from ingress controllers / monitoring
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Kubernetes API access
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Allow database connections (PostgreSQL 5432, Redis 6379)
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # Allow HTTPS/HTTP outbound (for image registry / AI APIs)
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubesight-frontend-policy
  namespace: kubesight
  labels:
    app.kubernetes.io/name: kubesight
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubesight
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from anywhere (ingress/users)
    - ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow communication to backend
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubesight
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8000
